name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  http: ^1.2.1
  path_provider: ^2.1.3
  archive: ^3.6.1
  video_player: ^2.9.1
  carousel_slider: ^5.0.0
  flutter_cache_manager: ^3.3.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/download_bg.png
    - assets/icon.png
    - sura/

