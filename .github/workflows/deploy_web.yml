name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Extract Surah media to web directory
        run: |
          mkdir -p web/surah
          for zipfile in sura/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Extracting $zipfile to web/surah/..."
              unzip -q -o "$zipfile" -d web/surah/
            fi
          done
          for d in web/surah/*/Book1; do
            if [ -d "$d" ]; then
              mv "$d" "$(dirname "$d")/book1"
            fi
          done

      - name: Build Flutter Web (Release)
        run: flutter build web --release --base-href "/zaqura-ebook-ios/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
